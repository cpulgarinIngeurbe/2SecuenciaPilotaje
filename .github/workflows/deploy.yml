name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Los datos que la app guarda en el repo no requieren redesplegar el sitio
    paths-ignore:
      - "SecuenciasAprobadas/**"
      - "Biblioteca/**"
      - "*_pilotes.xlsx"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Copy logo to public folder
        run: mkdir -p public && cp LogoIngeurbe2026.png public/ 2>/dev/null || true

      - name: Build
        run: npm run build
        env:
          VITE_GH_TOKEN: ${{ secrets.SECUENCIA_REPO_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
