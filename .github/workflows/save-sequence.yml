name: Guardar Secuencia Aprobada

on:
  workflow_dispatch:
    inputs:
      sequenceName:
        description: 'Nombre del archivo de secuencia'
        required: true
        type: string
      sequenceData:
        description: 'Datos JSON de la secuencia'
        required: true
        type: string

jobs:
  save-sequence:
    runs-on: ubuntu-latest
    steps:
      - name: Guardar secuencia via GitHub API
        run: |
          curl -X PUT \
            -H "Authorization: token ${{ secrets.SECUENCIA_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d "{\"message\":\"✅ Secuencia aprobada: ${{ inputs.sequenceName }}\",\"content\":\"$(echo -n '${{ inputs.sequenceData }}' | base64 -w 0)\"}" \
            "https://api.github.com/repos/cpulgarinIngeurbe/2SecuenciaPilotaje/contents/SecuenciasAprobadas/${{ inputs.sequenceName }}"
