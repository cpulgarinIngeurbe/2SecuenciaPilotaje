name: Guardar Secuencia Aprobada

on:
  workflow_dispatch:
    inputs:
      sequenceData:
        description: 'Datos JSON de la secuencia'
        required: true
        type: string

jobs:
  save-sequence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract filename from sequence data
        id: extract
        run: |
          TIMESTAMP=$(echo '${{ inputs.sequenceData }}' | grep -o '"timestamp":"[^"]*"' | cut -d'"' -f4 | sed 's/[:-]/-/g; s/T/-/; s/Z//')
          FILENAME="Secuencia-${TIMESTAMP}.json"
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          mkdir -p SecuenciasAprobadas

      - name: Save sequence file
        run: |
          echo '${{ inputs.sequenceData }}' > SecuenciasAprobadas/${{ steps.extract.outputs.filename }}

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add SecuenciasAprobadas/
          git commit -m "✅ Secuencia aprobada: ${{ steps.extract.outputs.filename }}" || echo "No changes to commit"
          git push
